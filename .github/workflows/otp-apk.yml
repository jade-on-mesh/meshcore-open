name: Build OTP APK

# Standalone workflow so building a sideloadable APK doesn't depend on
# touching the upstream Build workflow's branch/PR triggers. Runs on demand
# (Actions tab -> Build OTP APK -> Run workflow) or automatically whenever a
# branch named otp-* is pushed, e.g. the otp-messenger branch this patch
# lands on.
on:
  workflow_dispatch:
  push:
    branches:
      - "otp-*"

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/settings.gradle', 'android/app/build.gradle', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - run: flutter pub get
      # Debug-signed release build: installable by sideloading (Android has
      # no issue with the default debug keystore for personal use), just not
      # eligible for the Play Store or an upgrade path from a store install.
      - run: flutter build apk --release --no-pub
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meshcore-open-otp-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
